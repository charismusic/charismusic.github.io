<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Free Music Note Generator | Charis Music</title>
  <meta name="description" content="Create and download treble, bass, alto and tenor clef notes. Choose pitch, note value, accidental and spacing with this free Charis Music tool.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#ffffff">
  <link rel="canonical" href="https://www.charismusic.co.uk/notegenerator">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="tool-shell" aria-labelledby="page-title">
    <header class="brand-header">
      <a class="brand" href="https://www.charismusic.co.uk/" target="_top" rel="noopener">Charis Music</a>
      <h1 id="page-title">Free Music Note Generator</h1>
      <p>Create a single note for teaching materials, worksheets and apps.</p>
    </header>

    <section class="controls" aria-label="Music note settings">
      <label>
        <span>1. Pitch</span>
        <select id="pitchSelect" aria-label="Pitch"></select>
      </label>

      <label>
        <span>2. Clef</span>
        <select id="clefSelect" aria-label="Clef">
          <option value="treble">Treble clef</option>
          <option value="bass">Bass clef</option>
          <option value="alto">Alto clef</option>
          <option value="tenor">Tenor clef</option>
        </select>
      </label>

      <label>
        <span>3. Note value</span>
        <select id="valueSelect" aria-label="Note value">
          <option value="quarter">Quarter note</option>
          <option value="eighth">Eighth note</option>
        </select>
      </label>

      <label>
        <span>4. Accidental</span>
        <select id="accidentalSelect" aria-label="Accidental">
          <option value="natural">Natural (no accidental)</option>
          <option value="sharp">Sharp ♯</option>
          <option value="flat">Flat ♭</option>
        </select>
      </label>

      <label>
        <span>5. Spacing</span>
        <select id="spacingSelect" aria-label="Spacing">
          <option value="near">Near clef</option>
          <option value="key">Key signature space</option>
          <option value="keytime">Key + time signature space</option>
        </select>
      </label>
    </section>

    <section class="preview-card" aria-labelledby="preview-title">
      <div class="preview-heading">
        <h2 id="preview-title">Preview</h2>
        <span id="selectionSummary">Treble clef · C4 · Quarter note · Near clef</span>
      </div>
      <div id="svgPreview" class="preview" role="img" aria-label="Generated music note"></div>
    </section>

    <div class="actions">
      <button id="downloadSvg" type="button">Download SVG</button>
      <button id="downloadPng" type="button" class="secondary">Download PNG</button>
    </div>

    <footer>
      <p>Free tool by <a href="https://www.charismusic.co.uk/" target="_top" rel="noopener">Charis Music</a></p>
      <nav aria-label="Charis Music resources">
        <a href="https://www.charismusic.co.uk/4operations" target="_top" rel="noopener">Musical Four Operations</a>
        <a href="https://www.charismusic.co.uk/music-apps" target="_top" rel="noopener">Charis Music Apps</a>
      </nav>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
